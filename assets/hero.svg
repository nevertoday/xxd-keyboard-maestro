键</text><text x="64" y="340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" fill="#6D6B67" text-anchor="start">对照 Keyboard Maestro 官方 Wiki · 非官方中文教程</text><rect class="n0" x="64" y="396" width="34" height="34" rx="7" fill="#111111"/><text x="81" y="419" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text class="l0" x="114" y="420" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#111111" text-anchor="start">装好它，按一个键打开常用的 App</text><rect class="n1" x="64" y="458" width="34" height="34" rx="7" fill="#111111"/><text x="81" y="481" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text class="l1" x="114" y="482" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#111111" text-anchor="start">打几个字，出来一整段</text><rect class="n2" x="64" y="520" width="34" height="34" rx="7" fill="#111111"/><text x="81" y="543" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text class="l2" x="114" y="544" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#111111" text-anchor="start">一个键，做完一串事</text><rect x="704" y="40" width="440" height="372" rx="12" fill="#FFFFFF" stroke="#E9E7E4" filter="url(#sh)"/><text x="724" y="68" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#6D6B67" text-anchor="start">Global Macro Group</text><text x="724" y="94" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start">每天开工</text><rect x="1100" y="70" width="22" height="22" rx="5" fill="none" stroke="#D6D3CE" stroke-width="1.5"/><g class="done"><circle cx="1111" cy="81" r="11" fill="#4F8A55"/><path d="M1106.0 81.0 l3.5 3.5 l6.6 -6.8" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M704 112 H1144" stroke="#E9E7E4"/><text x="724" y="136" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#6D6B67" text-anchor="start">Triggered by any of the following:</text><rect class="trg" x="720" y="148" width="408" height="46" rx="8" fill="#E4EEFB" stroke="#E9E7E4"/><rect class="trgb" x="720" y="158" width="3" height="26" rx="1.5" fill="#111111"/><text x="738" y="176" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Hot Key</text><rect x="805" y="158" width="70" height="26" rx="5" fill="#FAFAF8" stroke="#D6D3CE"/><text x="840.1" y="176" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#111111" text-anchor="middle">⌃⌥⌘T</text><text x="887.1" y="176" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" fill="#6D6B67" text-anchor="start">is pressed</text><text x="724" y="222" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#6D6B67" text-anchor="start">Will execute the following actions:</text><rect class="a0" x="720" y="234" width="408" height="50" rx="8" fill="#E4EEFB" stroke="#E9E7E4"/><rect class="a0b" x="720" y="244" width="3" height="30" rx="1.5" fill="#111111"/><text x="738" y="256" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Activate a Specific Application</text><text x="738" y="274" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#6D6B67" text-anchor="start">日历</text><rect class="a1" x="720" y="290" width="408" height="50" rx="8" fill="#E4EEFB" stroke="#E9E7E4"/><rect class="a1b" x="720" y="300" width="3" height="30" rx="1.5" fill="#111111"/><text x="738" y="312" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Open a URL</text><text x="738" y="330" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#6D6B67" text-anchor="start">https://wiki.keyboardmaestro.com/</text><rect class="a2" x="720" y="346" width="408" height="50" rx="8" fill="#E4EEFB" stroke="#E9E7E4"/><rect class="a2b" x="720" y="356" width="3" height="30" rx="1.5" fill="#111111"/><text x="738" y="368" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC